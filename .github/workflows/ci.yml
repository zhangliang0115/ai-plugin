name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm run lint
      # node:test's child-runner IPC has a known intermittent deserialization
      # flake ("Unable to deserialize cloned data") that fails otherwise-green
      # runs. Retry per test file (3 attempts) before accepting a failure.
      - name: Test (per-file retry for runner IPC flake)
        run: |
          fail=0
          for f in test/*.test.js; do
            ok=0
            for attempt in 1 2 3; do
              if node --test "$f"; then ok=1; break; fi
              echo "::warning::$f attempt $attempt failed, retrying"
            done
            if [ "$ok" != "1" ]; then fail=1; echo "::error::persistent failure: $f"; fi
          done
          exit $fail
      - run: npm run check-drift
      - name: Validate registry entries
        run: node scripts/validate-registry.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node bin/aipx.js --version
      - run: node bin/aipx.js --help > /dev/null
      - run: node bin/aipx.js lint skills

  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/aipx.js --version
      - name: Test (per-file retry for runner IPC flake)
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem test -Filter *.test.js | ForEach-Object {
            $ok = $false
            foreach ($i in 1..3) {
              node --test $_.FullName
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "::warning::$($_.Name) attempt $i failed, retrying"
            }
            if (-not $ok) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) { Write-Host "::error::persistent failures: $($failed -join ', ')"; exit 1 }
