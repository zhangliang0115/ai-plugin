name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm run lint
      # Node 22's test runner has a known intermittent IPC deserialization
      # flake ("Unable to deserialize cloned data") that fails otherwise-green
      # runs; retry a couple of times before accepting a failure.
      - name: Test (retry for Node 22 runner flake)
        run: |
          for i in 1 2 3; do
            npm test && exit 0
            echo "::warning::test attempt $i failed, retrying"
          done
          exit 1
      - run: npm run check-drift
      - name: Validate registry entries
        run: node scripts/validate-registry.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node bin/aipx.js --version
      - run: node bin/aipx.js --help > /dev/null
      - run: node bin/aipx.js lint skills

  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/aipx.js --version
      - name: Test (retry for Node 22 runner flake)
        shell: pwsh
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            npm test
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::test attempt $i failed, retrying"
          }
          if (-not $ok) { exit 1 }
