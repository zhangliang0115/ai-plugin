name: npm publish

# Publishes to npm on tagged releases once the NPM_TOKEN secret is configured
# (npmjs.com → Access Tokens → Generate new token, type "Automation", then add
# it as the NPM_TOKEN repository secret). Without the secret the job skips
# with a notice instead of failing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm run lint
      - run: npm test
      - name: Publish (skipped until NPM_TOKEN secret is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not configured — skipping npm publish."
            echo "To enable: npmjs.com → Access Tokens → Generate new token (Automation),"
            echo "then add it as the NPM_TOKEN secret in repository settings."
            exit 0
          fi
          npm publish --access public
